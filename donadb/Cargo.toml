[package]
name = "donadb"
version = "0.1.3"
edition = "2024"
authors = ["Truthlinked Labs <Donatus@truthlinked.org>"]
description = "DonaDB is TruthLinked Labs' lightweight, crash-safe LSM storage engine for high-throughput post-quantum blockchain nodes."
license = "Apache-2.0 OR MIT"
readme = "README.md"
homepage = "https://truthlinked.org"
repository = "https://github.com/truth-linked"
documentation = "https://truthlinked.org/docs/donadb"
keywords = ["donadb", "lsm", "blockchain", "post-quantum", "storage"]
categories = ["database-implementations", "data-structures", "concurrency"]
include = [
  "Cargo.toml",
  "README.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  "src/**/*.rs",
  "tests/**/*.rs",
]

[lib]
name = "donadb"
path = "src/lib.rs"

[[bin]]
name = "donadb-bench"
path = "src/main.rs"

[[bin]]
name = "donadb-tps"
path = "src/bin/tps_test.rs"

[dependencies]
dashmap = "6"
bytes = "1"
crossbeam-channel = "0.5"
crossbeam-skiplist = "0.1"
memmap2 = "0.9"
libc = "0.2"
arc-swap = "1"
crc32fast = "1"
lz4_flex = "0.11"
blake3 = "1.5"
thiserror = "1"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "donadb-crash-writer"
path = "src/bin/crash_writer.rs"
