[package]
name = "truthlinked-net"
authors = ["TruthLinked Labs <Donatus@truthlinked.org>"]
description = "TruthLinked networking layer — built for the TruthLinked blockchain."
version = "0.1.2"
edition = "2021"
license = "MIT"
readme = "README.md"
homepage = "https://truthlinked.org"
repository = "https://github.com/truth-linked/truthlinked"
documentation = "https://docs.rs/truthlinked-net"
keywords = ["truthlinked", "networking", "post-quantum", "blockchain", "p2p"]
categories = ["network-programming", "cryptography"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**/*.rs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
hex = "0.4"
anyhow = "1.0"
truthlinked-state = "0.1.3"
truthlinked-core = "0.1.3"
truthlinked-governance = "0.1.2"
tokio-tungstenite = "0.21"
futures-util = "0.3"
fips203 = "0.4.3"
fips204 = "0.4.6"
sha2 = "0.10"
aes-gcm = "0.10.3"
rand = "0.8"
hkdf = "0.12.4"
postcard = { version = "1.1", features = ["alloc"] }
async-trait = "0.1"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
