[package]
name = "truthlinked-axiom"
version = "0.1.3"
edition = "2021"
authors = ["TruthLinked Labs <Donatus@truthlinked.org>"]
description = "Axiom virtual machine and bytecode primitives for TruthLinked cells."
license = "MIT"
homepage = "https://truthlinked.org"
repository = "https://github.com/truth-linked/truthlinked"
documentation = "https://docs.rs/truthlinked-axiom"
keywords = ["truthlinked", "axiom", "vm", "blockchain", "cells"]
categories = ["cryptography", "virtualization", "no-std"]
include = ["Cargo.toml", "src/**/*.rs"]

[lib]
name = "truthlinked_axiom"

[dependencies]

[features]
default = []
std = []

[[bin]]
name = "bench_vm"
path = "src/bin/bench_vm.rs"
required-features = ["std"]
