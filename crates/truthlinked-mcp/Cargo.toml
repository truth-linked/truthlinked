[package]
name = "truthlinked-mcp"
authors = ["TruthLinked Labs <Donatus@truthlinked.org>"]
description = "On-chain MCP registry, agent policy, tool-call, and private-balance primitives for TruthLinked."
version = "0.1.2"
edition = "2021"
license = "MIT"
readme = "README.md"
homepage = "https://truthlinked.org"
repository = "https://github.com/truth-linked/truthlinked"
documentation = "https://docs.rs/truthlinked-mcp"
keywords = ["truthlinked", "mcp", "agents", "blockchain", "post-quantum"]
categories = ["cryptography", "authentication", "data-structures"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**/*.rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.5"
aes-gcm = "0.10"
winterfell = "0.13"
hex = "0.4"
im = "15"
tracing = "0.1"
truthlinked-core = "0.1.3"
truthlinked-governance = "0.1.2"
truthlinked-oracle = "0.1.2"
truthlinked-runtime = "0.1.2"
truthlinked-staking = "0.1.2"
