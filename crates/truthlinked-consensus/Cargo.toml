[package]
name = "truthlinked-consensus"
authors = ["TruthLinked Labs <Donatus@truthlinked.org>"]
description = "TruthLinked consensus engine — built for the TruthLinked blockchain."
version = "0.1.2"
edition = "2021"
license = "MIT"
readme = "README.md"
homepage = "https://truthlinked.org"
repository = "https://github.com/truth-linked/truthlinked"
documentation = "https://docs.rs/truthlinked-consensus"
keywords = ["truthlinked", "consensus", "blockchain", "post-quantum", "validators"]
categories = ["cryptography", "network-programming"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**/*.rs"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
hex = "0.4"
rand = "0.8"
rayon = "1.11"
blake3 = "1.5"
sha2 = "0.10"
postcard = { version = "1.1", features = ["alloc"] }
arc-swap = "1.7"
async-trait = "0.1"
fips204 = "0.4.6"
tokio-tungstenite = "0.21"
futures-util = "0.3"
chrono = "0.4"
im = "15"

truthlinked-state = "0.1.3"
truthlinked-net = "0.1.2"
truthlinked-mcp = "0.1.2"
truthlinked-runtime = "0.1.2"
truthlinked-core = "0.1.3"
truthlinked-governance = "0.1.2"
truthlinked-staking = "0.1.2"
truthlinked-oracle = "0.1.2"
donadb-x = "0.1.0"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "consensus-bench"
path = "src/bin/consensus_bench.rs"
