[package]
name = "truthlinked-axiom-compiler"
version = "0.2.0"
edition = "2021"
authors = ["TruthLinked Labs <dev@truthlinked.org>"]
description = "Compiler for the .cell language. Transforms high-level cell source into Axiom bytecode and manifests for the TruthLinked post-quantum blockchain."
license = "MIT"
readme = "README.md"
homepage = "https://truthlinked.org"
repository = "https://github.com/truth-linked/truthlinked"
documentation = "https://docs.rs/truthlinked-axiom-compiler"
keywords = ["truthlinked", "axiom", "cell", "compiler", "blockchain", "post-quantum"]
categories = ["compilers", "development-tools"]
include = ["Cargo.toml", "src/**/*.rs", "examples/**/*.cell", "README.md"]

[[bin]]
name = "axiom-cc"
path = "src/main.rs"

[dependencies]
truthlinked-sdk = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
